name: Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # DEPLOY IS PAUSED. This job only lists the FTP home (read-only) so the
  # contents of the server can be verified before any further sync.
  list-server:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: List FTP home (read-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" -e '
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:timeout 30;
            echo "== pwd ==";
            pwd;
            echo "== top level ==";
            cls -la;
            echo "== one level up ==";
            cls -la ..;
            echo "== autobot (no .git objects) =="; find autobot | grep -v "/.git/" | head -250;
            echo "== autobot git refs =="; find autobot | grep -E "/.git/(HEAD|config|refs/heads)" | head -10;
            quit'
